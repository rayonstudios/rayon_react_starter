name: Preview deploy to Cloudflare Workers on PR (main)
on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies and build
        run: npm ci && npm run build:prod
        env:
          CI: false
          VITE_FIREBASE_API_KEY: "${{ secrets.VITE_FIREBASE_API_KEY }}"

      - name: Create Cloudflare Pages Project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create rayon-react-starter-prod --production-branch main
        continue-on-error: true

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name rayon-react-starter-prod --branch "pr-${{ github.event.pull_request.number }}"

      - name: Comment on PR
        uses: ./.github/actions/pr-comment
        with:
          deploy-url: https://pr-${{ github.event.pull_request.number }}.rayon-react-starter-prod.pages.dev
          sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
